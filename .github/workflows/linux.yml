name: Linux verification

on:
  push:
    branches: [main, 'integration/**', 'cross-platform/**']
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  linux-ci:
    name: linux-ci
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      TEMP: ${{ github.workspace }}/target/tmp
      TMP: ${{ github.workspace }}/target/tmp
      TMPDIR: ${{ github.workspace }}/target/tmp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: mkdir -p "$CARGO_TARGET_DIR" "$TMPDIR"
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      # The default all-target suite supervises all six ignored Linux workers by exact name,
      # enforces deadlines/reaping, and rejects zero-match output. Do not run them unbounded.
      - name: Verify independent lock contender prerequisite
        run: python3 --version
      - run: cargo build --workspace --release --locked
      - run: cargo fmt --all --check
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --release --test review_admission_runtime --locked
      - run: cargo test --release --test freeze_committed_binding --locked
      - run: cargo test --release --test selected_review_demo --locked
      - run: cargo test -p ai-agent-evidence-binder --release --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - run: git diff --check
      - name: Reject tracked source drift
        run: git diff --exit-code
